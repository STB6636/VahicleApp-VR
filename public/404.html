<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting — Vehicle App</title>
  <script>
    (function () {
      var l = window.location;
      var segs = l.pathname.split('/').filter(Boolean);
      var repoBase = segs.length > 0 ? '/' + segs[0] : '';
      var subPath = segs.length > 1 ? '/' + segs.slice(1).join('/') : '/';
      l.replace(l.protocol + '//' + l.host + repoBase + '/#' + subPath + (l.search || ''));
    })();
  </script>
</head>
<body></body>
</html>
