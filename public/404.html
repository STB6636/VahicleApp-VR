<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting — Vehicle App</title>
  <script>
    (function () {
      var l = window.location;
      var host = (l.hostname || l.host || '').toLowerCase();
      var segs = l.pathname.split('/').filter(Boolean);
      var isGithubPages = host.endsWith('github.io');
      var repoBase = isGithubPages && segs.length > 0 ? '/' + segs[0] : '';
      var restSegs = isGithubPages ? segs.slice(1) : segs;
      var subPath = restSegs.length > 0 ? '/' + restSegs.join('/') : '/';
      l.replace(l.protocol + '//' + l.host + repoBase + '/#' + subPath + (l.search || ''));
    })();
  </script>
</head>
<body></body>
</html>
